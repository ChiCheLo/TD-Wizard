# TD Wizard — Entity Registry
#
# 跨 GDD 的事實登錄表。這裡的每個值都是「已被某份 GDD 定案」的事實。
#
# 用途：撰寫新 GDD 時，/design-system 會先讀此檔。若新 GDD 寫出與此處不同的值，
#       會當場示警，而非等到 /consistency-check 才發現漂移。
#
# 規則：
#   - source        = 定義此項目的 GDD（唯一真實來源，只有它能改值）
#   - referenced_by = 引用此項目的其他 GDD（不可自行變更值）
#   - 要改值必須回到 source GDD 修改，並同步檢查所有 referenced_by
#
# 最後更新：2026-09-20（gem-socketing.md 兩輪 /design-review 後同步）
#
# ⚠️ 已知流程缺口：/design-review 不比對本檔。審查修訂數值後必須手動回來同步，
#    或補跑 /consistency-check。FusionCost 曾因此漂移（GDD 2 vs 本檔 3）。

version: 1

items:

  # ─────────────────────────────────────────────
  # 寶石（實例制，每顆各自持有等級）
  # ─────────────────────────────────────────────

  - name: 火
    type: gem
    gem_name: 爐心石
    hue_slot: H1
    hue: "橙紅 25°"
    attack_type: 區域
    targeting: 射程內隨機敵人
    mechanic: 週期性投放固定範圍燃燒區，持續數秒
    attack_speed: 中
    stack_rule: 可疊加，上限 3 層
    source: gem-socketing.md
    referenced_by: []

  - name: 霜
    type: gem
    gem_name: 凍泉晶
    hue_slot: H4
    hue: "青 190°"
    attack_type: 區域
    targeting: 射程最前緣（固定位置）
    mechanic: 持續維持減速場，敵人進入時受一次性傷害
    attack_speed: 持續
    stack_rule: 減速不疊加取最高；一次性傷害每次進入新場皆觸發
    source: gem-socketing.md
    referenced_by: []

  - name: 雷
    type: gem
    gem_name: 鐘鳴石
    hue_slot: H2
    hue: "黃 55°"
    attack_type: 指向
    targeting: 第一隻 → 跳躍
    mechanic: 鏈式跳彈，可重複命中同一目標
    attack_speed: 中
    stack_rule: 總跳躍次數上限 4，每跳衰減
    source: gem-socketing.md
    referenced_by: []

  - name: 風
    type: gem
    gem_name: 風信石
    hue_slot: H3
    hue: "綠 130°"
    attack_type: 指向
    targeting: 最前排數隻
    mechanic: 群體小幅擊退，距離隨機
    attack_speed: 快
    stack_rule: 擊退不疊加，同時命中僅套用一次
    source: gem-socketing.md
    referenced_by: []

  - name: 蝕
    type: gem
    gem_name: 鏽紋紫晶
    hue_slot: H5
    hue: "紫 285°"
    attack_type: 指向
    targeting: 固定第一隻，不越位
    mechanic: 單體重擊，附加穿甲 debuff
    attack_speed: 慢
    stack_rule: 穿甲可疊加，受 25% 下限約束
    source: gem-socketing.md
    referenced_by: []

  # ─────────────────────────────────────────────
  # 公式
  # ─────────────────────────────────────────────

  - name: FinalDamage
    type: formula
    expression: "BaseDamage × LevelMult × AffinityMult × (1 − ArmorReduction)"
    variables: [BaseDamage, LevelMult, AffinityMult, ArmorReduction]
    output_range: "0.1875× – 1.8×（相對於 BaseDamage）"
    note: >
      下限 0.1875 = Lv1(1.0) × 被剋(0.75) × 護甲減免上限(1−0.75=0.25)。
      2026-09-20 更正——舊值 0.5625 只算到「高防但非上限」的中間情況，未推到 ArmorReductionCap 的真正下限
    source: gem-socketing.md
    referenced_by: []

  - name: EffectiveArmor
    type: formula
    expression: "max(BaseArmor × 0.25, BaseArmor − ΣPenetration)"
    variables: [BaseArmor, ΣPenetration]
    output_range: "BaseArmor × 0.25 – BaseArmor"
    note: 穿甲存在硬性下限，超出部分浪費（刻意的邊際遞減）
    source: gem-socketing.md
    referenced_by: []

  - name: JumpDamage
    type: formula
    expression: "BaseDamage × 0.8^n （n = 跳躍序號，初擊 n=0）"
    variables: [BaseDamage, n]
    output_range: "總和上限 3.362 × BaseDamage"
    source: gem-socketing.md
    referenced_by: []

  - name: KnockbackDistance
    type: formula
    expression: "BaseKnockback × Random(0.6, 1.4)"
    variables: [BaseKnockback]
    output_range: "0.6× – 1.4× BaseKnockback"
    source: gem-socketing.md
    referenced_by: []

  - name: ArmorReduction
    type: formula
    expression: "min(ArmorReductionCap, EffectiveArmor / ArmorReductionScale)"
    variables: [EffectiveArmor, ArmorReductionCap, ArmorReductionScale]
    output_range: "0 – 0.75"
    note: "design-review 修訂新增。原版本只定義輸出範圍，未定義換算式，導致 FinalDamage 無法被實作"
    source: gem-socketing.md
    referenced_by: []

  # ─────────────────────────────────────────────
  # 常數（下游 GDD 不可牴觸）
  # ─────────────────────────────────────────────

  - name: AffinityRing
    type: constant
    value: "Fire → Frost → Lightning → Wind → Eclipse → Fire"
    unit: 相剋環
    note: >
      五屬性相剋環。箭頭方向為「剋」。每個屬性剋一個、被一個剋，其餘中立。
      2026-09-20 新增，取代原本敵人各自持有的 WeakAttribute / ResistAttribute 模型
      ——連攜技能需要「賦予敵人屬性後用剋制屬性打」的元素間關係，舊模型無法表達。
      互斥性由環的結構自帶：任兩屬性間至多一個方向的剋制關係。
    source: gem-socketing.md
    referenced_by: []

  - name: AttributeExposureRate
    type: constant
    value: 0.3
    unit: 比例（持有 BaseAttribute 的敵人佔比）
    note: >
      多數敵人 BaseAttribute = null，約三成持有屬性（特殊怪／菁英／頭目）。
      2026-09-20 第 3 輪審查定案。屬性因此是「事件」而非背景噪音，呼應支柱③；
      並大幅降低「至少兩種可行屬性解」的死局風險。
      ⚠️ 提高此值會同時放大死局風險與剋制的決策權重，須連帶重審關卡驗證規則。
    source: gem-socketing.md
    referenced_by: []

  - name: WeaknessMult
    type: constant
    value: 1.5
    unit: 倍率
    note: >
      攻擊屬性剋敵人屬性時的傷害倍率。
      ⚠️ 不可為了「讓剋制更有感」而調高——此值受 LevelMult 約束，
      必須同時滿足 Lv1 剋制(1.50) > Lv2 中立(1.20) 與 Lv1 剋制(1.50) > Lv2 被剋(0.90)，
      動它會破壞 game-concept §4.1「等級不可輾壓屬性選擇」的驗算
    source: gem-socketing.md
    referenced_by: []

  - name: ResistMult
    type: constant
    value: 0.75
    unit: 倍率
    note: 敵人屬性剋攻擊屬性時的傷害倍率。刻意小於 WeaknessMult 的對稱值（獎勵大於懲罰）
    source: gem-socketing.md
    referenced_by: []

  - name: NeutralMult
    type: constant
    value: 1.0
    unit: 倍率
    note: 環上無剋制關係時的倍率。基礎塔（無寶石）與無屬性敵人恆為此值
    source: gem-socketing.md
    referenced_by: []

  - name: LevelMult_Lv1
    type: constant
    value: 1.0
    unit: 倍率
    source: gem-socketing.md
    referenced_by: []

  - name: LevelMult_Lv2
    type: constant
    value: 1.2
    unit: 倍率
    note: 刻意不足以壓過屬性選擇（Lv1 打弱點 1.5 > Lv2 打抗性 0.9）
    source: gem-socketing.md
    referenced_by: []

  - name: ArmorFloorRatio
    type: constant
    value: 0.25
    unit: 比例
    note: 防禦力永不低於原始值的 25%
    source: gem-socketing.md
    referenced_by: []

  - name: ArmorReductionCap
    type: constant
    value: 0.75
    unit: 比例
    note: 傷害減免上限。確保無實質免疫（呼應反支柱⑤）
    source: gem-socketing.md
    referenced_by: []

  - name: ArmorReductionScale
    type: constant
    value: 200
    unit: K（待原型實測調整，需配合敵人系統 BaseArmor 範圍）
    note: "ArmorReduction = min(ArmorReductionCap, EffectiveArmor / K)。design-review 修訂新增，補上原本缺失的 EffectiveArmor→ArmorReduction 換算式"
    source: gem-socketing.md
    referenced_by: []

  - name: FireStackCap
    type: constant
    value: 3
    unit: 層
    source: gem-socketing.md
    referenced_by: []

  - name: ChainJumps
    type: constant
    value: 4
    unit: 次
    source: gem-socketing.md
    referenced_by: []

  - name: ChainFalloff
    type: constant
    value: 0.8
    unit: 倍率/跳
    source: gem-socketing.md
    referenced_by: []

  - name: KnockbackVariance
    type: constant
    value: 0.4
    unit: "±比例"
    source: gem-socketing.md
    referenced_by: []

  - name: FusionCost
    type: constant
    value: 2
    unit: 顆
    note: "2 顆同屬性 Lv1 → 1 顆 Lv2（消耗）。design-review 由 3 調降——原值下理性玩家幾乎不會主動融合，且約 6% 玩家整局湊不齊材料"
    source: gem-socketing.md
    referenced_by: []

  - name: SocketCost_C
    type: constant
    value: 0.6
    unit: 建造費的倍數
    note: 嵌入費。準備期取下全額退還，戰鬥期不退還
    source: gem-socketing.md
    referenced_by: []

  - name: GemDropPerLevel
    type: constant
    value: 2
    unit: 顆/關
    note: 原型階段的暫定方案，未來改為抽卡取得
    source: gem-socketing.md
    referenced_by: []

  - name: InitialGemCount
    type: constant
    value: 3
    unit: 顆
    note: >
      3 種各 1 顆，種類固定為 火、霜、風（2026-09-20 依 MVP 三個連攜技的配方回填）。
      不可隨機選取——此三種恰好湊得出全部三個 MVP 連攜技
    source: gem-socketing.md
    referenced_by: []

  - name: TowerSocketSlots
    type: constant
    value: 1
    unit: 槽
    note: 每座塔僅一個插槽
    source: gem-socketing.md
    referenced_by: []

  # ─────────────────────────────────────────────
  # 連攜系統（game-concept §3.2 定案，待連攜系統 GDD 補齊細部數值）
  # ─────────────────────────────────────────────

  - name: CastModeCancelRules
    type: constant
    value: "移動 → 取消；受擊 → 取消；皆無代價"
    unit: 規則
    note: 施法模式（選落點階段）的取消條件。取消不進 CD、不損失資源
    source: game-concept.md
    referenced_by: []

  - name: CastWindup
    type: constant
    value: 0.3
    unit: 秒
    note: 確認施放後的前搖。此期間可被攻擊打斷 → 短僵直，技能不進 CD。前搖結束後進入霸體
    source: game-concept.md
    referenced_by: []

  - name: CastModeDwellBudget
    type: constant
    value: 1.0
    unit: 秒（上限）
    note: >
      硬性設計約束——施法模式的目標停留時間。由於受擊即取消，若選落點需要仔細瞄準，
      連攜會在怪群密集時最難放出來。準心預設落點須一進入施法模式就是合理解。
      須由 /prototype --spike 實測驗證
    source: game-concept.md
    referenced_by: []

  - name: CastCircle
    type: formula
    expression: "圓心 = centroid(參與塔..., 巫師)；半徑 = max(參與塔的攻擊半徑)"
    variables: [參與塔座標, 巫師座標, 各塔攻擊半徑]
    note: >
      領域落點的可釋放範圍。巫師的座標是圓心計算的一部分，因此站位不只決定
      「能不能放」，更決定「能放到哪」。巫師往前走，圓就往前移
    source: game-concept.md
    referenced_by: [連攜系統.md]

  - name: ChainDetectionRadius
    type: formula
    expression: "ChainDetectionRadius = max(AttackRadius_i)，i 為場上目前所有已嵌合寶石的塔"
    variables: [AttackRadius_i]
    note: 配方檢查的感應半徑。以巫師座標為圓心蒐集範圍內的塔並依屬性分組
    source: 連攜系統.md
    referenced_by: []

  - name: ChainDomainRadius
    type: constant
    value: "待定（開發期 stub = 3 公尺，非設計定案）"
    unit: 公尺
    note: >
      地面領域固定小徑（適用「炎寒領域」「凍土」），領域大小固定、不隨落點圓縮放。
      待 /prototype --spike 實測手感後定案，見 Open Questions #1
    source: 連攜系統.md
    referenced_by: []

  - name: ChainSkillCooldown
    type: constant
    value: 30
    unit: 秒
    note: MVP 三個連攜技共用同一起點值，各技能CD各自獨立計時；日後平衡時各自獨立調整
    source: 連攜系統.md
    referenced_by: []

  - name: EmberDuration
    type: constant
    value: 8
    unit: 秒
    note: >
      「星星之火」火種標記在未被風屬性攻擊觸發引爆前的存活時間。超時未觸發則火種消失，
      Phase 2 永不發生。填補 星星之火 條目 phases[0].duration 原標記的「有時限（待定）」
    source: 連攜系統.md
    referenced_by: [星星之火]

  - name: ChainDamageMult
    type: constant
    value: 0.5
    unit: 倍率
    note: >
      三個 MVP 連攜技共用的巫師傷害貢獻係數（「炎寒領域」火海階段／「凍土」熔岩灼燒／
      「星星之火」引爆皆套用）。與 gem-socketing 的 WeaknessMult(1.5)／ResistMult(0.75) 疊乘，
      調整前須注意剋制本身是「調味不是主菜」，份量應直接調整此係數而非疊加剋制倍率
    source: 連攜系統.md
    referenced_by: []

  - name: ChainSkillDamage
    type: formula
    expression: "ChainSkillDamage = WizardBaseDamage × ChainDamageMult"
    variables: [WizardBaseDamage, ChainDamageMult]
    note: >
      三技能共用的巫師傷害貢獻公式。WizardBaseDamage 尚待巫師能力 GDD 定案（Open Questions #2），
      MVP 為固定值，非成長軸（裝備系統列入 v1.0 後才成長）
    source: 連攜系統.md
    referenced_by: []

  - name: AppliedAttributeDuration_炎寒領域
    type: constant
    value: 4.0
    unit: 秒
    note: >
      「炎寒領域」暴風雪賦予的霜屬性時效——階段1剩餘最長2秒+階段2全長2秒的最差情況。
      若後段判定時已超過時效，只以敵人原生 BaseAttribute 計算剋制（可能無剋制）
    source: 連攜系統.md
    referenced_by: []

  # ─────────────────────────────────────────────
  # MVP 連攜技（game-concept §3.2 定案，細部數值待連攜系統 GDD）
  #
  # ⚠️ targeting / uses_cast_circle / phase_advance 是**逐技能宣告的自由欄位**，
  #    不是分類系統。不可據此建立列舉型別——每招都是獨立的表現方式，
  #    v1.0 擴到 10+ 招時會出現這三欄無法描述的形態。
  # ─────────────────────────────────────────────

  - name: StartingGemTypes
    type: constant
    value: [火, 霜, 風]
    unit: 屬性種類
    note: >
      起始 3 顆寶石的固定種類。由 MVP 三個連攜技的配方反推——
      此三種恰好湊得出全部三個技能。雷與蝕在 MVP 無對應連攜技（3 技能的數學極限）
    source: game-concept.md
    referenced_by: [gem-socketing.md]

  - name: 炎寒領域
    type: chain_skill
    direction: 霜 → 火
    targeting: 地面區域
    uses_cast_circle: true
    phase_advance: 計時自動
    recipe: {霜: 1, 火: 1}
    phases:
      - {duration: 2.0, effect: "暴風雪——賦予經過的敵人霜屬性 ＋ 緩速"}
      - {duration: 2.0, effect: "火海——火剋霜 ×1.5，額外造成巫師基本傷害的一定 %"}
    role: 爆發傷害
    cognition: 反應型
    uses_affinity_combo: true
    source: game-concept.md
    referenced_by: []

  - name: 凍土
    type: chain_skill
    direction: 火 → 霜
    targeting: 地面區域
    uses_cast_circle: true
    phase_advance: 計時自動（階段2 為 t=2.0 的瞬間快照）
    recipe: {火: 1, 霜: 1}
    phases:
      - {duration: 2.0, effect: "熔岩——經過者受灼燒。此技能唯一的傷害來源"}
      - {duration: 1.5, effect: "冷卻成岩石——以 t=2.0 快照判定，當下站在熔岩上的敵人定身 1.5 秒"}
    role: 灼燒 ＋ 硬控
    cognition: 預判型
    uses_affinity_combo: false
    note: >
      走「火剋霜」的反方向，階段2 打不出剋制，故刻意不依賴傷害。
      定身期間受攻擊不解除（可解除等於在塔防裡自廢）。
      岩石僅地面視覺變化，不阻擋路徑，未被控到的敵人照常通行
    source: game-concept.md
    referenced_by: []

  - name: 星星之火
    type: chain_skill
    direction: 火 → 風
    targeting: 單一敵人
    uses_cast_circle: false
    phase_advance: 條件觸發（遭受風屬性攻擊），時間不確定
    recipe: {火: 1, 風: 1}
    phases:
      - {duration: 有時限（待定）, effect: "準心遠距離點燃一隻敵人，進入「火種」狀態。不受落點圓約束"}
      - {duration: 5.0, effect: "遭受風屬性攻擊時觸發——引爆為大火，對其自身與路徑後方一定距離內的敵人造成 5 秒灼燒"}
    role: 延遲引爆
    cognition: 佈局型
    uses_affinity_combo: false
    note: >
      「火種」是獨立標記，**不是 AppliedAttribute**——不寫入屬性欄位，
      故不會讓蝕塔額外吃 ×1.5，也不會覆寫菁英怪的原生屬性。
      階段2 由條件觸發，時間不確定，可能永不觸發（火種過期消失）。
      ⚠️ 準心不受落點圓約束，是「拿支柱②換支柱①」的刻意交換，見 game-concept §3.2。
      ⚠️ 瞄準時視野收窄為基準 FOV 的 1.5 倍放大（類 FPS ADS 瞄準鏡效果，
      連攜系統.md GDD session 補充定案），區別於落點圓技能（炎寒領域／凍土）
      的正常視野瞄準——遠距離點燃單一敵人需要這層精確度，其餘技能不套用。
      **會打空，且打空一樣進CD**：左鍵確認一律正常進入 Windup（與其他連攜技流程一致，
      不因是否命中而分岐），前搖完成後消耗 CD；hit box 只決定 Phase 1 點燃效果是否生效
      （未命中則不產生火種標記，Phase 2 永不觸發），沒有免費重試。
      見 連攜系統.md Visual/Audio Requirements 與 Edge Cases
